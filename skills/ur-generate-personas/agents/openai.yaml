interface:
  display_name: "调研目标用户画像生成"
  short_description: "根据课题和目标用户生成可信的合成用户画像"
  default_prompt: "使用 $ur-generate-personas，从当前任务的 shared_context.md 读取课题、全量候选群体和目标用户。先确定画像数量与群体配额，再生成自洽的基础画像和调研相关画像。逐人检查年龄、职业、收入、婚育与设备是否冲突。personas.json 按 templates/persona_template.json 使用扁平中文键值；当前人物没有实际内容的字段整项省略，不填 null、空字符串或“不适用”。无相关经验者不输出使用习惯和判断。另输出 persons_summary.txt、persons/ 下的一人一文件及审计结果。构建比例不代表真实用户分布，不读取问卷或 plan.json。"
